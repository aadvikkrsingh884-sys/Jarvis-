name: Build Jarvis Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project ZIP if present
        run: |
          set -e
          mkdir -p workspace
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" ! -path "./workspace/*" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found project archive: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d workspace
          else
            echo "No ZIP archive found; copying repository files into workspace"
            rsync -a --exclude='.git' --exclude='workspace' ./ workspace/
          fi

      - name: Locate Android project root and configure environment
        id: locate
        run: |
          set -e
          BUILD_FILE=$(find workspace -maxdepth 4 -path "*/app/build.gradle.kts" -o -path "*/app/build.gradle" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "::error::Could not locate app/build.gradle.kts inside the repository or extracted ZIP."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$(dirname "$BUILD_FILE")")
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "Detected Android project root: $PROJECT_ROOT"

          cd "$PROJECT_ROOT"

          # Handle .env.example conditionally without failing if absent
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
              echo "Created .env from .env.example"
            else
              touch .env
              echo "Created empty .env (.env.example not present)"
            fi
          fi

          # Inject GEMINI_API_KEY from GitHub Secrets if configured (never printed to logs)
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            printf '\nGEMINI_API_KEY=%s\n' "${{ secrets.GEMINI_API_KEY }}" >> .env
          fi

          # Ensure debug.keystore exists if debugConfig points to ${rootDir}/debug.keystore
          if grep -q 'debugConfig' app/build.gradle.kts 2>/dev/null && [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore required by app/build.gradle.kts debugConfig..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_root }}
        run: |
          set -e
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Verify generated APK
        id: verify_apk
        working-directory: ${{ steps.locate.outputs.project_root }}
        run: |
          set -e
          APK_PATH=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "::error::Debug APK was not generated or is empty."
            exit 1
          fi
          echo "apk_path=${{ steps.locate.outputs.project_root }}/$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Verified APK: $APK_PATH ($(du -h "$APK_PATH" | cut -f1))"

      - name: Upload Jarvis APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: ${{ steps.verify_apk.outputs.apk_path }}
          if-no-files-found: error
          
